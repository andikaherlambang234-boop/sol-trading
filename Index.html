<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNIPER QUANT AI</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#0f172a; color:white; font-family:sans-serif; }
.glass { background:rgba(30,41,59,0.8); border:1px solid #334155; border-radius:12px; }
</style>
</head>

<body class="p-3 flex flex-col gap-3">

<!-- INPUT -->
<div class="glass p-3 flex gap-2">
<input id="caInput" placeholder="Paste CA..." class="flex-1 p-2 bg-black border rounded text-cyan-400">
<button onclick="scanCoin()" class="bg-cyan-600 px-4 rounded">SCAN</button>
</div>

<!-- STATUS -->
<div class="glass p-3">
<div id="sniperStatus">Menunggu scan...</div>
<div id="marketData" class="text-xs text-slate-400"></div>
</div>

<!-- ACTION -->
<div class="glass p-2 flex gap-2">
<button onclick="saveTrade(currentCA,lastScore,'win')" class="bg-green-600 px-2">WIN</button>
<button onclick="saveTrade(currentCA,lastScore,'lose')" class="bg-red-600 px-2">LOSE</button>
<a id="tradeBtn" target="_blank" class="bg-blue-600 px-2">OPEN TRADE</a>
</div>

<!-- CHART -->
<div class="grid md:grid-cols-2 gap-3">
<div class="glass h-[350px]"><iframe id="dexFrame" class="w-full h-full"></iframe></div>
<div class="glass h-[350px]"><iframe id="rugFrame" class="w-full h-full"></iframe></div>
</div>

<!-- LOG -->
<div class="glass p-3">
<h2>⚡ LOG</h2>
<div id="newPairs" class="text-xs max-h-[200px] overflow-y-auto"></div>
</div>

<script>

// ================= GLOBAL
let currentCA="";
let lastScore=0;

// ================= SAVE TRADE
function saveTrade(ca,score,result){
let db=JSON.parse(localStorage.getItem("trades")||"[]");
db.push({ca,score,result});
localStorage.setItem("trades",JSON.stringify(db));
alert("Saved");
}

// ================= AI SERVER
async function getAI(data){
try{
const res=await fetch("https://ai-sniper.onrender.com/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});
let j=await res.json();
return j.win_probability;
}catch{return null;}
}

// ================= BASIC AI
function analyze(p){
let liq=p.liquidity.usd||0;
let mcap=p.fdv||0;
let vol=p.volume.h24||0;

let scam=0;
if(liq<5000) scam+=30;
if(mcap>liq*10) scam+=20;

return {scam,vol};
}

// ================= HEDGE SCORE
function scoreEngine(d){
let s=100;
if(d.liq<10000) s-=20;
if(d.mcap>200000) s-=15;
s-=d.scam;
return Math.max(0,s);
}

// ================= PATTERN
function pattern(d){
if(d.vol>d.liq) return "MOMENTUM";
if(d.mcap>d.liq*10) return "OVERVALUED";
return "NORMAL";
}

// ================= MAIN
async function scanCoin(){

const ca=document.getElementById("caInput").value.trim();
if(!ca) return;

currentCA=ca;

document.getElementById("dexFrame").src=`https://dexscreener.com/solana/${ca}?embed=1&theme=dark`;
document.getElementById("rugFrame").src=`https://rugcheck.xyz/tokens/${ca}`;
document.getElementById("tradeBtn").href=`https://dexscreener.com/solana/${ca}`;

try{
const r=await fetch(`https://api.dexscreener.com/latest/dex/tokens/${ca}`);
const d=await r.json();

if(!d.pairs?.length){
document.getElementById("sniperStatus").innerHTML="❌ Not found";
return;
}

let p=d.pairs[0];

let liq=p.liquidity.usd||0;
let mcap=p.fdv||0;
let vol=p.volume.h24||0;

let ai=analyze(p);

let finalScore=scoreEngine({
liq,mcap,scam:ai.scam
});

lastScore=finalScore;

let pat=pattern({liq,mcap,vol});

// ================= AI SERVER
let prob=await getAI({
score:finalScore,
liq,
mcap,
vol
});

// ================= UI
let status="❌ SKIP";
if(finalScore>70) status="🔥 READY";

document.getElementById("sniperStatus").innerHTML=status;

document.getElementById("marketData").innerHTML=`
Liq:$${liq} | Mcap:$${mcap}
<br>Score:${finalScore}
<br>Pattern:${pat}
<br>AI:${prob? (prob*100).toFixed(1)+"%":"-"}
`;

}catch{
document.getElementById("sniperStatus").innerHTML="ERROR";
}
}

// ================= AUTO SCAN (ENTER)
document.getElementById("caInput").addEventListener("keypress",e=>{
if(e.key==="Enter") scanCoin();
});

</script>

</body>
</html>
